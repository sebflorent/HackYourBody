name: HackYourBody
options:
  bundleIdPrefix: com.hackyourbody
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Hack Your Body"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSHealthShareUsageDescription: "Hack Your Body utilise vos données de santé pour suivre vos pas, votre sommeil, et votre poids afin de personnaliser votre programme."
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Hack Your Body enregistre vos séances d'entraînement et votre poids dans Apple Health."
    INFOPLIST_KEY_NSCameraUsageDescription: "Hack Your Body utilise la caméra pour prendre des photos de ta progression physique."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Hack Your Body accède à ta galerie pour sélectionner des photos de progression."

targets:
  HackYourBody:
    type: application
    platform: iOS
    sources:
      - path: HackYourBody
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackyourbody.app
        CODE_SIGN_ENTITLEMENTS: HackYourBody/Resources/HackYourBody.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_IDENTITY: "Apple Development"
    entitlements:
      path: HackYourBody/Resources/HackYourBody.entitlements
      properties:
        com.apple.developer.healthkit: true
